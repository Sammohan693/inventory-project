{% extends 'base.html' %}

{% block content %}

<div class="product-wrapper fade-up">

    <div class="product-glass">

        <h1 class="product-title">{{ product.name }}</h1>

        

        <div class="product-info">
            <p><strong>Price:</strong> ₹{{ product.price }}</p>
            <p><strong>Quantity:</strong> {{ product.quantity }}</p>
        </div>

    </div>

</div>

{% endblock %}
